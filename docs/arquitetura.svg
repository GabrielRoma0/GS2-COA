<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Arquitetura do Sistema Inteligente de Gerenciamento de Filas Virtuais</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .caixa { fill: #fff; stroke: #333; stroke-width: 2; rx: 10; }
      .cpu { fill: #e3eef7; stroke: #1f5f8b; stroke-width: 3; }
      .mem { fill: #f3ecdc; stroke: #8a6a1c; stroke-width: 2; }
      .ent { fill: #e4f2e7; stroke: #1d6b3a; stroke-width: 2; }
      .sai { fill: #fbe9e6; stroke: #a3271b; stroke-width: 2; }
      .rede { fill: #ece8f6; stroke: #5a3f9a; stroke-width: 2; }
      .t { font-size: 17px; font-weight: 700; fill: #111; }
      .s { font-size: 13.5px; fill: #333; }
      .l { font-size: 13px; fill: #111; font-weight: 600; }
      .f { stroke: #333; stroke-width: 2; fill: none; }
      .grupo { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="#fbfaf7"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="800">Fila virtual do posto de atendimento à pessoa com deficiência — arquitetura</text>
  <text x="600" y="58" text-anchor="middle" class="s">ESP32 simulado no Wokwi · entrada → processamento/memória → saída · comunicação MQTT com o painel web</text>

  <!-- Grupo do dispositivo -->
  <rect x="20" y="80" width="775" height="590" class="grupo" rx="14"/>
  <text x="36" y="102" class="l">Dispositivo no posto (ESP32 DevKitC, placa única)</text>

  <!-- Entradas -->
  <rect x="40" y="130" width="200" height="74" class="ent" rx="10"/>
  <text x="140" y="158" text-anchor="middle" class="t">Botão CHEGADA</text>
  <text x="140" y="180" text-anchor="middle" class="s">GPIO 18 · pull-up interno</text>
  <text x="140" y="196" text-anchor="middle" class="s">debounce 40 ms</text>

  <rect x="40" y="224" width="200" height="74" class="ent" rx="10"/>
  <text x="140" y="252" text-anchor="middle" class="t">Botão ATENDIDO</text>
  <text x="140" y="274" text-anchor="middle" class="s">GPIO 19 · pull-up interno</text>
  <text x="140" y="290" text-anchor="middle" class="s">debounce 40 ms</text>

  <rect x="40" y="318" width="200" height="60" class="ent" rx="10"/>
  <text x="140" y="344" text-anchor="middle" class="t">Monitor Serial</text>
  <text x="140" y="364" text-anchor="middle" class="s">UART 115200 · c / a / l / m</text>

  <!-- CPU -->
  <rect x="300" y="130" width="250" height="250" class="cpu" rx="12"/>
  <text x="425" y="160" text-anchor="middle" class="t">CPU · ESP32</text>
  <text x="425" y="182" text-anchor="middle" class="s">Xtensa LX6 32 bits, 2 núcleos</text>
  <text x="425" y="200" text-anchor="middle" class="s">até 240 MHz</text>
  <line x1="320" y1="214" x2="530" y2="214" stroke="#1f5f8b"/>
  <text x="425" y="236" text-anchor="middle" class="s">loop(): lê entradas → atualiza</text>
  <text x="425" y="254" text-anchor="middle" class="s">a fila (fila.h) → recalcula as</text>
  <text x="425" y="272" text-anchor="middle" class="s">2 estimativas → atualiza saídas</text>
  <text x="425" y="290" text-anchor="middle" class="s">→ publica na rede</text>
  <line x1="320" y1="304" x2="530" y2="304" stroke="#1f5f8b"/>
  <text x="425" y="326" text-anchor="middle" class="s">Núcleo 0: pilha Wi-Fi/TCP-IP</text>
  <text x="425" y="344" text-anchor="middle" class="s">Núcleo 1: loop() do programa</text>
  <text x="425" y="366" text-anchor="middle" class="s">Periféricos: GPIO, I2C, UART, rádio</text>

  <!-- Memória -->
  <rect x="300" y="410" width="250" height="240" class="mem" rx="12"/>
  <text x="425" y="438" text-anchor="middle" class="t">Memória</text>
  <text x="314" y="464" class="l">SRAM 520 KB (dados)</text>
  <text x="314" y="484" class="s">• struct Fila ≈ 2,1 KB (contadores,</text>
  <text x="314" y="501" class="s">  registro circular 256 × 8 B)</text>
  <text x="314" y="518" class="s">• tela 1 KB · texto JSON 640 B</text>
  <text x="314" y="535" class="s">• buffer MQTT 768 B</text>
  <text x="314" y="552" class="s">• heap do Wi-Fi/TCP-IP/MQTT</text>
  <text x="314" y="584" class="l">Flash 4 MB (programa)</text>
  <text x="314" y="604" class="s">• firmware + coeficientes do</text>
  <text x="314" y="621" class="s">  modelo (modelo.h, constantes)</text>

  <!-- Saídas -->
  <rect x="605" y="130" width="175" height="100" class="sai" rx="10"/>
  <text x="692" y="158" text-anchor="middle" class="t">Display OLED</text>
  <text x="692" y="180" text-anchor="middle" class="s">SSD1306 128×64</text>
  <text x="692" y="198" text-anchor="middle" class="s">I2C · SDA 21 / SCL 22</text>
  <text x="692" y="216" text-anchor="middle" class="s">endereço 0x3C</text>

  <rect x="605" y="250" width="175" height="80" class="sai" rx="10"/>
  <text x="692" y="278" text-anchor="middle" class="t">LEDs</text>
  <text x="692" y="300" text-anchor="middle" class="s">GPIO 25: verde (ok)</text>
  <text x="692" y="318" text-anchor="middle" class="s">GPIO 26: vermelho (erro)</text>

  <rect x="605" y="350" width="175" height="70" class="rede" rx="10"/>
  <text x="692" y="378" text-anchor="middle" class="t">Rádio Wi-Fi</text>
  <text x="692" y="398" text-anchor="middle" class="s">802.11 b/g/n 2,4 GHz</text>
  <text x="692" y="414" text-anchor="middle" class="s">Wokwi-GUEST</text>

  <!-- Internet -->
  <rect x="860" y="300" width="320" height="170" class="rede" rx="12"/>
  <text x="1020" y="330" text-anchor="middle" class="t">Internet</text>
  <text x="1020" y="356" text-anchor="middle" class="s">Broker MQTT público</text>
  <text x="1020" y="374" text-anchor="middle" class="s">broker.hivemq.com</text>
  <text x="1020" y="398" text-anchor="middle" class="s">ESP32: MQTT/TCP porta 1883</text>
  <text x="1020" y="416" text-anchor="middle" class="s">Navegador: MQTT/WebSocket TLS 8884</text>
  <text x="1020" y="440" text-anchor="middle" class="s">Servidor NTP (pool.ntp.org) → hora</text>
  <text x="1020" y="458" text-anchor="middle" class="s">real dos eventos (UDP 123)</text>

  <rect x="860" y="510" width="320" height="140" class="sai" rx="12"/>
  <text x="1020" y="540" text-anchor="middle" class="t">Painel web (navegador)</text>
  <text x="1020" y="564" text-anchor="middle" class="s">pessoas na fila · espera IA × média</text>
  <text x="1020" y="582" text-anchor="middle" class="s">concluídos · gráfico · registro (CSV)</text>
  <text x="1020" y="606" text-anchor="middle" class="s">botões virtuais (entrada remota)</text>
  <text x="1020" y="628" text-anchor="middle" class="s">celular da família ou tela do posto</text>

  <rect x="860" y="130" width="320" height="130" class="mem" rx="12"/>
  <text x="1020" y="158" text-anchor="middle" class="t">Treino do modelo (PC, offline)</text>
  <text x="1020" y="182" text-anchor="middle" class="s">histórico SIMULADO (1.627 chegadas)</text>
  <text x="1020" y="200" text-anchor="middle" class="s">regressão linear por mínimos quadrados</text>
  <text x="1020" y="218" text-anchor="middle" class="s">→ coeficientes b0, b1, b2 + média</text>
  <text x="1020" y="236" text-anchor="middle" class="s">gravados em firmware/modelo.h</text>

  <!-- Setas -->
  <path d="M240,167 L298,190" class="f"/>
  <polygon points="298.0,190.0 289.8,180.8 285.7,191.1" fill="#333"/>
  <path d="M240,261 L298,250" class="f"/>
  <polygon points="298.0,250.0 286.2,246.6 288.2,257.5" fill="#333"/>
  <path d="M240,348 L298,330" class="f"/>
  <polygon points="298.0,330.0 285.9,328.0 289.1,338.5" fill="#333"/>
  <text x="246" y="122" class="s">sinal digital</text>

  <path d="M410,380 L410,408" class="f"/>
  <polygon points="410.0,408.0 415.5,397.0 404.5,397.0" fill="#333"/>
  <path d="M440,408 L440,382" class="f"/>
  <polygon points="440.0,382.0 434.5,393.0 445.5,393.0" fill="#333"/>
  <text x="452" y="398" class="s">lê/grava</text>

  <path d="M550,180 L603,180" class="f"/>
  <polygon points="603.0,180.0 592.0,174.5 592.0,185.5" fill="#333"/>
  <path d="M550,290 L603,290" class="f"/>
  <polygon points="603.0,290.0 592.0,284.5 592.0,295.5" fill="#333"/>
  <path d="M550,372 L603,380" class="f"/>
  <polygon points="603.0,380.0 592.9,372.9 591.3,383.8" fill="#333"/>
  <path d="M603,398 L552,388" class="f"/>
  <polygon points="552.0,388.0 561.7,395.5 563.9,384.7" fill="#333"/>

  <path d="M780,380 L858,380" class="f"/>
  <polygon points="858.0,380.0 847.0,374.5 847.0,385.5" fill="#333"/>
  <path d="M858,400 L782,400" class="f"/>
  <polygon points="782.0,400.0 793.0,405.5 793.0,394.5" fill="#333"/>
  <text x="800" y="372" class="s" font-size="12">publica</text>
  <text x="798" y="418" class="s" font-size="12">comandos</text>

  <path d="M1020,470 L1020,508" class="f"/>
  <polygon points="1020.0,508.0 1025.5,497.0 1014.5,497.0" fill="#333"/>
  <path d="M1055,508 L1055,472" class="f"/>
  <polygon points="1055.0,472.0 1049.5,483.0 1060.5,483.0" fill="#333"/>
  <text x="1065" y="494" class="s">estado / comando</text>

  <path d="M860,150 L810,150 L810,114 L470,114 L470,128" class="f" stroke-dasharray="5 4"/>
  <polygon points="470.0,128.0 475.5,117.0 464.5,117.0" fill="#333"/>
  <text x="560" y="108" class="s">coeficientes entram no firmware</text>

  <!-- Legenda do fluxo -->
  <rect x="20" y="686" width="1160" height="122" fill="#fff" stroke="#bbb" rx="10"/>
  <text x="36" y="712" class="l">Fluxo de uma chegada:</text>
  <text x="36" y="736" class="s">1) o botão é apertado e o GPIO 18 vai a 0 V → 2) a CPU confirma depois de 40 ms estável (debounce) → 3) fila.h soma 1 na RAM e grava o evento</text>
  <text x="36" y="756" class="s">com a hora do NTP no registro circular → 4) recalcula a espera pela média e pela regressão → 5) o LED verde pisca e o OLED redesenha (I2C)</text>
  <text x="36" y="776" class="s">→ 6) publica o evento e o estado em JSON pelo Wi-Fi (MQTT) → 7) o broker repassa ao painel, que atualiza sem recarregar a página.</text>
  <text x="36" y="796" class="s">Botão ATENDIDO com a fila vazia: a operação é bloqueada (a contagem nunca fica negativa), o LED vermelho acende e um evento de erro é registrado.</text>
</svg>
